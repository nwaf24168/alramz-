<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>الرمز العقارية</title>
    <script type="text/javascript">
      // يتم تنفيذ هذا السكربت عند محاولة الوصول المباشر إلى مسار في التطبيق
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <meta http-equiv="refresh" content="0;URL='/alramz-'">
  </head>
  <body>
    <!-- يتم توجيه المستخدم إلى الصفحة الرئيسية -->
  </body>
</html>
